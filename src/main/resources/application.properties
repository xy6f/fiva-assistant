spring.application.name=FIVA_Assistant
spring.profiles.active=dev

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fiva_assistant?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=changeme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=30

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# AI - DeepSeek (text chat)
ai.deepseek.base-url=https://api.deepseek.com/v1
ai.deepseek.api-key=changeme
ai.deepseek.model=deepseek-v4-flash

# AI - Vision Model (for OCR, OpenAI-compatible)
ai.vision.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
ai.vision.api-key=changeme
ai.vision.model=qwen3.7-plus

# Server
server.port=8080
# SSE streaming
server.servlet.response-buffer-size=0
server.compression.enabled=false

# 阿里云 OSS
aliyun.oss.endpoint=oss-cn-beijing.aliyuncs.com
aliyun.oss.bucket-name=fiva-assistant
aliyun.oss.access-key-id=changeme
aliyun.oss.access-key-secret=changeme
aliyun.oss.domain=https://fiva-assistant.oss-cn-beijing.aliyuncs.com

# JWT
jwt.secret=changeme
